<script>
  // Link Google Apps Script terhubung ke akun Google Sheets yang baru
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyViJuWBY5MuP2ov98Mf92QuzH4eow4CJ17nC1KosbsErXXnaBJYqMVNO2wY2iJS2_D/exec";

  const form = document.getElementById('meteringForm');
  const btnSimpan = document.getElementById('btnSimpan');

  // 1. FUNGSI UNTUK MENYIMPAN DATA (Muammar, Murjani, dll)
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (btnSimpan) {
        btnSimpan.innerText = "Menyimpan...";
        btnSimpan.disabled = true;
      }

      const payload = {
        petugas: document.getElementById('namaPetugas') ? document.getElementById('namaPetugas').value : '',
        jam: document.getElementById('jamSlot') ? document.getElementById('jamSlot').value : '',
        nilai: document.getElementById('nilaiMeter') ? document.getElementById('nilaiMeter').value : ''
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors", // Wajib agar tidak diblokir CORS browser
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("Data berhasil tersimpan ke Google Drive akun baru!");
        form.reset();
        if (btnSimpan) {
          btnSimpan.innerText = "Simpan Data";
          btnSimpan.disabled = false;
        }
        setTimeout(muatDataTerkini, 1500); // Refresh tabel otomatis
      })
      .catch(error => {
        console.error("Gagal menyimpan:", error);
        alert("Gagal menyimpan data.");
        if (btnSimpan) {
          btnSimpan.innerText = "Simpan Data";
          btnSimpan.disabled = false;
        }
      });
    });
  }

  // 2. FUNGSI UNTUK MEMBACA DATA TERPUSAT DARI GOOGLE SHEETS
  function muatDataTerkini() {
    const tbody = document.getElementById('tabelData');
    if (!tbody) return;

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        tbody.innerHTML = "";

        if (!data || data.length <= 1) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Belum ada data diinput.</td></tr>';
          return;
        }

        // Tampilkan baris data (melewati baris header index ke-0)
        for (let i = 1; i < data.length; i++) {
          const row = data[i];
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 border-b";
          tr.innerHTML = `
            <td class="p-2 text-gray-500 text-xs">${row[0] ? new Date(row[0]).toLocaleString('id-ID') : '-'}</td>
            <td class="p-2 font-bold text-gray-800">${row[1] || '-'}</td>
            <td class="p-2">${row[2] || '-'}</td>
            <td class="p-2 text-right font-mono font-bold text-blue-700">${row[3] || '0'}</td>
          `;
          tbody.appendChild(tr);
        }
      })
      .catch(err => {
        console.error("Gagal memuat data:", err);
      });
  }

  // Otomatis muat data saat halaman dibuka
  window.onload = muatDataTerkini;
</script>
