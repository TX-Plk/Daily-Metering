<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Metering Accordion</title>
  <!-- Load Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Styling tambahan agar kontainer accordion pas dan tidak ada ruang kosong berlebih */
    .custom-accordion-body {
      background-color: #f8f9fa;
      padding: 2rem 1rem;
    }
    .metering-form-wrapper {
      background: #ffffff;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      padding: 1.5rem;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
  </style>
</head>
<body class="bg-light p-4">

  <div class="container" style="max-width: 800px;">
    <h4 class="mb-4">Panel Kontrol Metering</h4>
    
    <div class="accordion" id="accordionMetering">
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingMetering">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMetering" aria-expanded="true" aria-controls="collapseMetering">
            Form Input Metering
          </button>
        </h2>
        <div id="collapseMetering" class="accordion-collapse collapse show" aria-labelledby="headingMetering" data-bs-parent="#accordionMetering">
          
          <!-- Menggunakan Flexbox untuk memusatkan form dan menghindari ruang kosong vertikal yang berlebihan -->
          <div class="accordion-body custom-accordion-body d-flex flex-column align-items-center">
            
            <div class="w-100 metering-form-wrapper" style="max-width: 600px;">
              <form>
                <div class="mb-3">
                  <label for="meterId" class="form-label font-weight-bold">ID Metering</label>
                  <input type="text" class="form-control" id="meterId" placeholder="Contoh: MTR-001">
                </div>
                <div class="mb-3">
                  <label for="valueAwal" class="form-label">Nilai Awal (kWh)</label>
                  <input type="number" class="form-control" id="valueAwal" placeholder="0">
                </div>
                <div class="mb-3">
                  <label for="valueAkhir" class="form-label">Nilai Akhir (kWh)</label>
                  <input type="number" class="form-control" id="valueAkhir" placeholder="0">
                </div>
                <div class="mb-3">
                  <label for="catatan" class="form-label">Keterangan</label>
                  <textarea class="form-control" id="catatan" rows="2" placeholder="Catatan opsional..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Simpan Data Metering</button>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
