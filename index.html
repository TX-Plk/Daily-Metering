<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Report Metering</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
    <!-- HEADER -->
    <div class="border-b pb-4 mb-6 flex flex-col md:flex-row md:justify-between md:items-center gap-2">
      <div>
        <h1 class="text-2xl font-bold text-blue-900">Daily Report Metering</h1>
        <p class="text-xs text-gray-500">Sistem Sinkronisasi Data Metering Terpusat</p>
      </div>
      <div id="statusKoneksi" class="text-xs px-3 py-1 rounded-full bg-green-100 text-green-800 w-fit font-medium">
        ● Google Drive Terhubung
      </div>
    </div>

    <!-- FORM INPUT PETUGAS -->
    <form id="meteringForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-blue-50 p-4 rounded-lg border border-blue-100">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Nama Petugas</label>
        <select id="namaPetugas" class="w-full border border-gray-300 p-2 rounded text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" required>
          <option value="">-- Pilih Petugas --</option>
          <option value="Muammar">Muammar</option>
          <option value="Murjani">Murjani</option>
          <option value="Petugas 3">Petugas 3</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Jam / Slot</label>
        <input type="text" id="jamSlot" placeholder="Contoh: 00.00 - 06.00" class="w-full border border-gray-300 p-2 rounded text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Nilai Metering</label>
        <input type="number" step="any" id="nilaiMeter" placeholder="Masukkan Angka" class="w-full border border-gray-300 p-2 rounded text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" required />
      </div>

      <div class="flex items-end">
        <button type="submit" id="btnSimpan" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-2 rounded text-sm transition">
          Simpan Data
        </button>
      </div>
    </form>

    <!-- TABEL HASIL SINKRONISASI -->
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-md font-bold text-gray-800">Rekap Data Input (Multi-Petugas)</h2>
      <button onclick="muatDataTerkini()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded flex items-center gap-1">
        🔄 Refresh Data
      </button>
    </div>

    <div class="overflow-x-auto rounded-lg border border-gray-200">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="bg-blue-900 text-white text-xs uppercase tracking-wider">
            <th class="p-3 border-b">Waktu Input</th>
            <th class="p-3 border-b">Petugas</th>
            <th class="p-3 border-b">Jam / Slot</th>
            <th class="p-3 border-b text-right">Nilai Meter</th>
          </tr>
        </thead>
        <tbody id="tabelData" class="divide-y divide-gray-100 bg-white">
          <tr>
            <td colspan="4" class="p-4 text-center text-gray-500 text-xs">Memuat data dari Google Drive...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Link Google Apps Script terhubung ke akun Google Sheets yang baru
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyViJuWBY5MuP2ov98Mf92QuzH4eow4CJ17nC1KosbsErXXnaBJYqMVNO2wY2iJS2_D/exec";

    const form = document.getElementById('meteringForm');
    const btnSimpan = document.getElementById('btnSimpan');

    // 1. FUNGSI MENYIMPAN DATA (Muammar, Murjani, dll)
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (btnSimpan) {
          btnSimpan.innerText = "Menyimpan...";
          btnSimpan.disabled = true;
        }

        const payload = {
          petugas: document.getElementById('namaPetugas') ? document.getElementById('namaPetugas').value : '',
          jam: document.getElementById('jamSlot') ? document.getElementById('jamSlot').value : '',
          nilai: document.getElementById('nilaiMeter') ? document.getElementById('nilaiMeter').value : ''
        };

        fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
        .then(() => {
          alert("Data berhasil tersimpan ke Google Drive!");
          form.reset();
          if (btnSimpan) {
            btnSimpan.innerText = "Simpan Data";
            btnSimpan.disabled = false;
          }
          setTimeout(muatDataTerkini, 1500);
        })
        .catch(error => {
          console.error("Gagal menyimpan:", error);
          alert("Gagal menyimpan data.");
          if (btnSimpan) {
            btnSimpan.innerText = "Simpan Data";
            btnSimpan.disabled = false;
          }
        });
      });
    }

    // 2. FUNGSI MEMBACA DATA TERPUSAT DARI GOOGLE SHEETS
    function muatDataTerkini() {
      const tbody = document.getElementById('tabelData');
      if (!tbody) return;

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          tbody.innerHTML = "";

          if (!data || data.length <= 1) {
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500 text-xs">Belum ada data diinput.</td></tr>';
            return;
          }

          // Baris ke-0 adalah header Google Sheets, perulangan dimulai dari indeks ke-1
          for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50 transition";
            tr.innerHTML = `
              <td class="p-3 text-gray-500 text-xs">${row[0] ? new Date(row[0]).toLocaleString('id-ID') : '-'}</td>
              <td class="p-3 font-bold text-gray-800">${row[1] || '-'}</td>
              <td class="p-3 text-gray-600">${row[2] || '-'}</td>
              <td class="p-3 text-right font-mono font-bold text-blue-700">${row[3] || '0'}</td>
            `;
            tbody.appendChild(tr);
          }
        })
        .catch(err => {
          console.error("Gagal memuat data:", err);
          tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500 text-xs">Gagal memuat data dari server.</td></tr>';
        });
    }

    // Otomatis muat data saat halaman dibuka
    window.onload = muatDataTerkini;
  </script>
</body>
</html>
