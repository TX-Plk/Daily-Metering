<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report Metering</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIREBASE SDK MODULAR & CONFIG -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyPLlqTnIrGX-lsx5cL8V5a75x4neP7zA",
            authDomain: "metering-harian.firebaseapp.com",
            projectId: "metering-harian",
            storageBucket: "metering-harian.firebasestorage.app",
            messagingSenderId: "150918403414",
            appId: "1:150918403414:web:db08d70e3b3d8d0548b2f7",
            measurementId: "G-3NE0WWS4N8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDb = db;
        window.FirebaseFirestoreHelpers = { doc, setDoc, getDoc, onSnapshot, collection, getDocs };
    </script>
    
    <!-- CSS FORMAT CETAK 1 HALAMAN LANDSCAPE -->
    <style>
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            body { 
                background: white !important; 
                font-size: 7.5pt !important; 
                color: black !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            .print-shadow-none { box-shadow: none !important; border: 1px solid #cbd5e1 !important; }
            
            main { padding: 0 !important; border: none !important; }
            table { font-size: 7pt !important; border-collapse: collapse !important; width: 100% !important; }
            th, td { padding: 1px 2px !important; line-height: 1.1 !important; border: 1px solid #94a3b8 !important; }
            input, select { border: none !important; background: transparent !important; padding: 0 !important; font-size: 7pt !important; text-align: center !important; color: black !important; }
            
            .sign-section {
                margin-top: 15px !important;
                padding-top: 4px !important;
                page-break-inside: avoid !important;
            }
            .sign-box { height: 35px !important; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen transition-colors duration-200">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw33ZMCGbGTfrtGby0kwlbSEO3n7P6USmYK_xy7mhser-Rsr15GnrfWbDbyGd7yNATb/exec";
        const INITIAL_USERS = [
            { username: "muammar", password: "123", name: "Muammar Ghadafi", role: "admin", station: "STA. MNCGROUP PALANGKA RAYA" },
            { username: "murjani", password: "123", name: "Murjani", role: "operator", station: "STA. MNCGROUP PALANGKA RAYA" },
            { username: "debak", password: "123", name: "Debak", role: "operator", station: "STA. MNCGROUP PALANGKA RAYA" }
        ];

        const TIME_SLOTS = ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];

        const getAutoCurrentSlot = () => {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const totalMinutesNow = currentHour * 60 + currentMinute;

            let closestSlot = TIME_SLOTS[0];
            let minDiff = Infinity;

            TIME_SLOTS.forEach(slot => {
                const [h, m] = slot.split(':').map(Number);
                const totalSlotMinutes = h * 60 + m;
                const diff = Math.abs(totalMinutesNow - totalSlotMinutes);
                
                if (diff < minDiff) {
                    minDiff = diff;
                    closestSlot = slot;
                }
            });

            return closestSlot;
        };

        const createTransmitterParams = (prefix, sqUnit = "dB", ssUnit = "dB") => [
            { id: `${prefix}_pwr`, name: "Output Power TX", unit: "W", type: "number", warnMax: null },
            { id: `${prefix}_ref`, name: "Reflected Power TX", unit: "W", type: "number", warnMax: 5 },
            { id: `${prefix}_sq`, name: "Indovision/Kvision SQ", unit: sqUnit, type: "number", warnMax: null },
            { id: `${prefix}_ss`, name: "Indovision/Kvision SS", unit: ssUnit, type: "number", warnMax: null },
            { id: `${prefix}_cn`, name: "C/N", unit: "dB", type: "number", warnMax: null },
            { id: `${prefix}_rf`, name: "RF Level", unit: "dBm", type: "number", warnMax: null },
            { id: `${prefix}_ber`, name: "BER", unit: "Desimal", type: "ber_decimal", warnMax: null },
        ];

        const PARAMETERS = [
            { 
                category: "1. Power & Facility", 
                items: [
                    { id: "pln_kwh", name: "PLN Metering", unit: "kWh", type: "number", warnMax: null },
                    { id: "ups_load", name: "UPS Load", unit: "%", type: "number", warnMax: 80 },
                    { id: "genset_min", name: "Genset Working", unit: "Menit", type: "number", warnMax: null },
                    { id: "genset_solar", name: "Solar Genset", unit: "Liter", type: "number", warnMax: null },
                    { id: "ac_status", name: "Status AC", unit: "Status", type: "enum", options: ["OK", "NOT OK"] },
                    { id: "fo_status", name: "Status Fiber Optic", unit: "Status", type: "enum", options: ["OK", "NOT OK"] },
                ]
            },
            { category: "2. Transmitter RCTI", items: createTransmitterParams("rcti", "dB", "dBm") },
            { category: "3. Transmitter MNCTV", items: createTransmitterParams("mnc", "%", "%") },
            { category: "4. Transmitter GTV", items: createTransmitterParams("gtv", "%", "%") },
            { category: "5. Transmitter iNews", items: createTransmitterParams("inews", "%", "%") },
            { 
                category: "6. Backup System", 
                items: [
                    { id: "backup_sq", name: "Parabola Backup SQ", unit: "%", type: "number", warnMax: null },
                    { id: "backup_ss", name: "Parabola Backup SS", unit: "%", type: "number", warnMax: null },
                ]
            }
        ];

        const ALL_PARAM_ITEMS = PARAMETERS.flatMap(cat => cat.items);

        const getLocalDateString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const LogoMNC = ({ className = "h-8" }) => (
            <img 
                src="Picture ok.png" 
                alt="MNC Transmission" 
                className={`${className} object-contain bg-white rounded p-1 shadow-sm`}
                onError={(e) => {
                    e.target.onerror = null;
                    e.target.src = "https://i.ibb.co/3yPZ5pW/Picture-ok.png";
                }}
            />
        );

        function App() {
            const [usersDB, setUsersDB] = useState(() => {
                const saved = localStorage.getItem("metering_users_db");
                return saved ? JSON.parse(saved) : INITIAL_USERS;
            });

            const [user, setUser] = useState(null);
            const [loginInput, setLoginInput] = useState({ username: "", password: "", remember: false });
            const [loginError, setLoginError] = useState("");

            const [showChangePassModal, setShowChangePassModal] = useState(false);
            const [passForm, setPassForm] = useState({ oldPass: "", newPass: "", confirmPass: "" });
            const [passMsg, setPassMsg] = useState({ error: "", success: "" });

            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [pdfHistory, setPdfHistory] = useState([]);
            const [loadingHistory, setLoadingHistory] = useState(false);

            const [date, setDate] = useState(() => getLocalDateString());
            const [status, setStatus] = useState("Draft");
            const [rejectReason, setRejectReason] = useState("");
            const [viewMode, setViewMode] = useState(() => window.innerWidth < 768 ? "mobile" : "matrix");
            
            const [darkMode, setDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem("metering_theme");
                return savedTheme ? savedTheme === "dark" : true;
            });
            
            const autoCurrentSlot = getAutoCurrentSlot();
            const [selectedSlot, setSelectedSlot] = useState(() => autoCurrentSlot);
            
            const [driveLoading, setDriveLoading] = useState(false);
            const [autoSyncStatus, setAutoSyncStatus] = useState("");
            
            const [meteringData, setMeteringData] = useState({});
            const [operatorsBySlot, setOperatorsBySlot] = useState({});

            const isFormLocked = (status === "Submitted" || status === "Approved") && user?.role !== "admin";

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem("metering_theme", "dark");
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem("metering_theme", "light");
                }
            }, [darkMode]);

            useEffect(() => {
                const savedSession = localStorage.getItem("metering_session");
                if (savedSession) setUser(JSON.parse(savedSession));
            }, []);

            useEffect(() => {
                localStorage.setItem("metering_users_db", JSON.stringify(usersDB));
            }, [usersDB]);

            useEffect(() => {
                if (!user || !window.firebaseDb) return;

                setAutoSyncStatus("Menghubungkan Realtime Cloud...");
                const db = window.firebaseDb;
                const { doc, onSnapshot } = window.FirebaseFirestoreHelpers;
                
                const docRef = doc(db, "reports", date);
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        setMeteringData(cloudData.meteringData || {});
                        setOperatorsBySlot(cloudData.operatorsBySlot || {});
                        setStatus(cloudData.status || "Draft");
                        setRejectReason(cloudData.rejectReason || "");
                        setAutoSyncStatus("🟢 Sinkronisasi Realtime Aktif");
                    } else {
                        setMeteringData({});
                        setOperatorsBySlot({});
                        setStatus("Draft");
                        setRejectReason("");
                        setAutoSyncStatus("🟡 Data Kosong (Belum ada input)");
                    }
                }, (error) => {
                    setAutoSyncStatus("🔴 Gagal Sinkronisasi Cloud");
                });

                return () => unsubscribe();
            }, [date, user]);

            const saveToCloud = async (targetDate, currentStatus, currentData, currentOps, currentReject = "") => {
                if (!window.firebaseDb) return;
                try {
                    setAutoSyncStatus("Menyimpan ke Cloud...");
                    const db = window.firebaseDb;
                    const { doc, setDoc } = window.FirebaseFirestoreHelpers;

                    const payload = {
                        date: targetDate,
                        status: currentStatus,
                        rejectReason: currentReject,
                        meteringData: currentData,
                        operatorsBySlot: currentOps,
                        updatedAt: new Date().toISOString()
                    };

                    await setDoc(doc(db, "reports", targetDate), payload);
                    setAutoSyncStatus("🟢 Perubahan Tersimpan di Cloud");
                } catch (e) {
                    setAutoSyncStatus("🔴 Gagal Menyimpan ke Cloud");
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const foundUser = usersDB.find(
                    u => u.username.toLowerCase() === loginInput.username.toLowerCase() && u.password === loginInput.password
                );

                if (foundUser) {
                    setUser(foundUser);
                    setLoginError("");
                    setLoginInput({ username: "", password: "", remember: false });
                    if (loginInput.remember) {
                        localStorage.setItem("metering_session", JSON.stringify(foundUser));
                    }
                } else {
                    setLoginError("Username atau password salah!");
                }
            };

            const handleLogout = () => {
                setUser(null);
                setLoginInput({ username: "", password: "", remember: false });
                localStorage.removeItem("metering_session");
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                setPassMsg({ error: "", success: "" });

                if (passForm.oldPass !== user.password) {
                    setPassMsg({ error: "Password lama tidak sesuai!", success: "" });
                    return;
                }
                if (passForm.newPass.length < 3) {
                    setPassMsg({ error: "Password baru minimal 3 karakter!", success: "" });
                    return;
                }
                if (passForm.newPass !== passForm.confirmPass) {
                    setPassMsg({ error: "Konfirmasi password baru tidak cocok!", success: "" });
                    return;
                }

                const updatedDB = usersDB.map(u => 
                    u.username === user.username ? { ...u, password: passForm.newPass } : u
                );
                const updatedUser = { ...user, password: passForm.newPass };

                setUsersDB(updatedDB);
                setUser(updatedUser);
                if (localStorage.getItem("metering_session")) {
                    localStorage.setItem("metering_session", JSON.stringify(updatedUser));
                }

                setPassMsg({ error: "", success: "Password berhasil diperbarui!" });
                setTimeout(() => {
                    setShowChangePassModal(false);
                    setPassForm({ oldPass: "", newPass: "", confirmPass: "" });
                    setPassMsg({ error: "", success: "" });
                }, 1500);
            };

            const isSlotComplete = (slot, currentData) => {
                return ALL_PARAM_ITEMS.every(param => {
                    const val = currentData[param.id]?.[slot];
                    return val !== undefined && val !== null && val.toString().trim() !== "";
                });
            };

            const handleInputChange = (paramId, timeSlot, value) => {
                if (isFormLocked) return;
                
                const updatedData = {
                    ...meteringData,
                    [paramId]: {
                        ...(meteringData[paramId] || {}),
                        [timeSlot]: value
                    }
                };

                const updatedOps = { ...operatorsBySlot };
                if (isSlotComplete(timeSlot, updatedData)) {
                    updatedOps[timeSlot] = user.name;
                } else {
                    delete updatedOps[timeSlot];
                }

                setMeteringData(updatedData);
                setOperatorsBySlot(updatedOps);

                saveToCloud(date, status, updatedData, updatedOps, rejectReason);
            };

            const handleDateChange = (newDate) => {
                setDate(newDate);
            };

            const handleSubmitReport = () => {
                if (!confirm("Apakah Anda yakin ingin menyubmit laporan ini? Laporan akan TERKUNCI setelah disubmit.")) return;
                setStatus("Submitted");
                saveToCloud(date, "Submitted", meteringData, operatorsBySlot, rejectReason);
                alert("Laporan berhasil disubmit dan telah TERKUNCI di Cloud!");
            };

            const handleExportMonthlyPdf = async () => {
                const monthYear = date.substring(0, 7); 
                setDriveLoading(true);
                try {
                    const db = window.firebaseDb;
                    const { collection, getDocs } = window.FirebaseFirestoreHelpers;
                    
                    const querySnapshot = await getDocs(collection(db, "reports"));
                    let reportsMap = {};

                    querySnapshot.forEach((docSnap) => {
                        const docId = docSnap.id;
                        if (docId.startsWith(monthYear)) {
                            reportsMap[docId] = docSnap.data();
                        }
                    });

                    if (Object.keys(reportsMap).length === 0) {
                        alert("Tidak ada data laporan untuk periode bulan " + monthYear + "!");
                        setDriveLoading(false);
                        return;
                    }

                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ 
                            action: "generateMonthlyPDF", 
                            month: monthYear, 
                            reportsMap: reportsMap,
                            parameters: PARAMETERS,
                            timeSlots: TIME_SLOTS
                        }),
                        redirect: "follow"
                    });

                    const result = await res.json();
                    if (result.status === "success") {
                        alert("Sukses! File PDF rekap bulanan persis format cetak berhasil dibuat di Google Drive.");
                        if (result.fileUrl) {
                            window.open(result.fileUrl, "_blank");
                        }
                    } else {
                        alert("Gagal rekap bulanan PDF: " + (result.message || "Kesalahan tidak dikenal"));
                    }
                } catch (err) {
                    alert("Gagal terhubung ke server atau memproses rekap PDF bulanan.");
                } finally {
                    setDriveLoading(false);
                }
            };

            const handleExportMonthlyExcel = async () => {
                const monthYear = date.substring(0, 7); 
                setDriveLoading(true);
                try {
                    const db = window.firebaseDb;
                    const { collection, getDocs } = window.FirebaseFirestoreHelpers;
                    
                    const querySnapshot = await getDocs(collection(db, "reports"));
                    let reportsMap = {};

                    querySnapshot.forEach((docSnap) => {
                        const docId = docSnap.id;
                        if (docId.startsWith(monthYear)) {
                            reportsMap[docId] = docSnap.data();
                        }
                    });

                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ 
                            action: "exportMonthlyExcel", 
                            monthYear: monthYear,
                            reportsMap: reportsMap,
                            parameters: PARAMETERS
                        }),
                        redirect: "follow"
                    });

                    const result = await res.json();
                    if (result.status === "success") {
                        alert("Sukses! File Excel/Spreadsheet rekap rata-rata bulanan berhasil dibuat di Google Drive.");
                        if (result.fileUrl) {
                            window.open(result.fileUrl, "_blank");
                        }
                    } else {
                        alert("Gagal membuat Excel rekap bulanan: " + (result.message || "Kesalahan tidak dikenal"));
                    }
                } catch (err) {
                    alert("Gagal terhubung ke server Google Apps Script.");
                } finally {
                    setDriveLoading(false);
                }
            };

            const fetchPdfHistory = async () => {
                setShowHistoryModal(true);
                setLoadingHistory(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "get_pdf_list" }),
                        redirect: "follow"
                    });
                    const result = await res.json();
                    if (result.status === "success") {
                        setPdfHistory(result.pdfs || []);
                    } else {
                        alert("Gagal mengambil riwayat file.");
                    }
                } catch (err) {
                    alert("Gagal terhubung ke Google Drive.");
                } finally {
                    setLoadingHistory(false);
                }
            };

            const sanitizeNumberInput = (val) => {
                let cleaned = val.replace(',', '.');
                cleaned = cleaned.replace(/[^0-9.-]/g, '');
                const parts = cleaned.split('.');
                if (parts.length > 2) {
                    cleaned = parts[0] + '.' + parts.slice(1).join('');
                }
                return cleaned;
            };

            const getFilledSlotsCount = () => {
                let filledSlots = 0;
                TIME_SLOTS.forEach(slot => {
                    if (isSlotComplete(slot, meteringData)) filledSlots++;
                });
                return filledSlots;
            };

            const countWarnings = () => {
                let count = 0;
                PARAMETERS.forEach(cat => {
                    cat.items.forEach(param => {
                        if (param.warnMax) {
                            TIME_SLOTS.forEach(slot => {
                                const val = parseFloat(meteringData[param.id]?.[slot]);
                                if (val && val > param.warnMax) count++;
                            });
                        }
                    });
                });
                return count;
            };

            const getTabIndex = (slotIndex, paramIndex) => {
                const totalParams = ALL_PARAM_ITEMS.length;
                return (slotIndex * totalParams) + paramIndex + 1;
            };

            const handleMatrixKeyDown = (e, slotIndex, paramIndex) => {
                const totalParams = ALL_PARAM_ITEMS.length;
                const totalSlots = TIME_SLOTS.length;
                let targetSlotIndex = slotIndex;
                let targetParamIndex = paramIndex;

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    if (paramIndex < totalParams - 1) targetParamIndex = paramIndex + 1;
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    if (paramIndex > 0) targetParamIndex = paramIndex - 1;
                } else if (e.key === "ArrowRight") {
                    if (e.target.selectionEnd === undefined || e.target.selectionEnd === e.target.value.length) {
                        if (slotIndex < totalSlots - 1) {
                            e.preventDefault();
                            targetSlotIndex = slotIndex + 1;
                        }
                    }
                } else if (e.key === "ArrowLeft") {
                    if (e.target.selectionStart === undefined || e.target.selectionStart === 0) {
                        if (slotIndex > 0) {
                            e.preventDefault();
                            targetSlotIndex = slotIndex - 1;
                        }
                    }
                }

                if (targetSlotIndex !== slotIndex || targetParamIndex !== paramIndex) {
                    const targetTabIndex = getTabIndex(targetSlotIndex, targetParamIndex);
                    const targetEl = document.querySelector(`[tabindex="${targetTabIndex}"]`);
                    if (targetEl) {
                        targetEl.focus();
                        if (targetEl.select) targetEl.select();
                    }
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen bg-slate-900 dark:bg-slate-950 flex items-center justify-center p-4">
                        <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden w-full max-w-md border border-slate-200 dark:border-slate-800">
                            <div className="bg-blue-600 p-6 text-white text-center flex flex-col items-center">
                                <LogoMNC className="h-12 mb-3" />
                                <h1 className="text-xl font-bold">Daily Report Metering</h1>
                                <p className="text-xs text-blue-100 mt-1">STA. MNCGROUP PALANGKA RAYA</p>
                            </div>

                            <form onSubmit={handleLogin} className="p-6 space-y-4" autoComplete="off">
                                {loginError && (
                                    <div className="bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500 p-3 text-red-700 dark:text-red-300 text-xs rounded">
                                        {loginError}
                                    </div>
                                )}

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Username</label>
                                    <input 
                                        type="text" 
                                        required
                                        autoComplete="off"
                                        value={loginInput.username}
                                        onChange={e => setLoginInput({...loginInput, username: e.target.value})}
                                        className="w-full p-2.5 border dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        placeholder="Masukkan username"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        required
                                        autoComplete="new-password"
                                        value={loginInput.password}
                                        onChange={e => setLoginInput({...loginInput, password: e.target.value})}
                                        className="w-full p-2.5 border dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        placeholder="Masukkan password"
                                    />
                                </div>

                                <div className="flex items-center justify-between text-xs">
                                    <label className="flex items-center text-slate-600 dark:text-slate-400 cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={loginInput.remember}
                                            onChange={e => setLoginInput({...loginInput, remember: e.target.checked})}
                                            className="mr-2 rounded text-blue-600" 
                                        />
                                        Remember Me
                                    </label>
                                </div>

                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition">
                                    Masuk ke Sistem
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-12">
                    <header className="bg-slate-900 dark:bg-slate-900 text-white shadow-lg sticky top-0 z-50 no-print border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <LogoMNC className="h-9" />
                                <div>
