<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Metering Report - Multi-User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo23MobXfSOK1u22fwiylixlOID5Y1xW0dXfVmsnJIiP2N21tQPPNHe2yyvn11ObH4/exec";
        const TIME_SLOTS = ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];

        function App() {
            const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [operatorName, setOperatorName] = useState("");
            const [selectedSlot, setSelectedSlot] = useState("08:00");
            const [meterValue, setMeterValue] = useState("");
            
            const [meteringData, setMeteringData] = useState({});
            const [operatorsBySlot, setOperatorsBySlot] = useState({});
            const [syncStatus, setSyncStatus] = useState("Siap");
            
            const syncTimeoutRef = useRef(null);

            const getMergedLocalData = (targetDate) => {
                let combinedMetering = {};
                let combinedOps = {};

                TIME_SLOTS.forEach(slot => {
                    const slotKey = `metering_${targetDate}_slot_${slot}`;
                    const raw = localStorage.getItem(slotKey);
                    if (raw) {
                        try {
                            const parsed = JSON.parse(raw);
                            if (parsed.data) {
                                Object.keys(parsed.data).forEach(pId => {
                                    if (!combinedMetering[pId]) combinedMetering[pId] = {};
                                    combinedMetering[pId][slot] = parsed.data[pId];
                                });
                            }
                            if (parsed.operator) combinedOps[slot] = parsed.operator;
                        } catch(e){}
                    }
                });
                return { meteringData: combinedMetering, operatorsBySlot: combinedOps };
            };

            useEffect(() => {
                fetchData(date);
            }, [date]);

            const fetchData = async (targetDate) => {
                setSyncStatus("Memuat data...");
                const local = getMergedLocalData(targetDate);
                if (Object.keys(local.meteringData).length > 0) {
                    setMeteringData(local.meteringData);
                    setOperatorsBySlot(local.operatorsBySlot);
                }

                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "load", date: targetDate })
                    });
                    const result = await res.json();
                    if (result && result.status === "success" && result.data) {
                        const serverMetering = result.data.meteringData || {};
                        const serverOps = result.data.operatorsBySlot || {};

                        const mergedMetering = { ...serverMetering };
                        Object.keys(local.meteringData).forEach(pId => {
                            mergedMetering[pId] = {
                                ...(serverMetering[pId] || {}),
                                ...(local.meteringData[pId] || {})
                            };
                        });

                        setMeteringData(mergedMetering);
                        setOperatorsBySlot({ ...serverOps, ...local.operatorsBySlot });
                        setSyncStatus("Terkoneksi");
                    }
                } catch (err) {
                    setSyncStatus("Mode Offline (Lokal)");
                }
            };

            const handleSaveInput = () => {
                if (!operatorName) {
                    alert("Nama operator wajib diisi!");
                    return;
                }

                const paramId = "DefaultParam";
                
                setMeteringData(prev => ({
                    ...prev,
                    [paramId]: {
                        ...(prev[paramId] || {}),
                        [selectedSlot]: meterValue
                    }
                }));

                setOperatorsBySlot(prev => ({
                    ...prev,
                    [selectedSlot]: operatorName
                }));

                try {
                    const slotKey = `metering_${date}_slot_${selectedSlot}`;
                    const slotData = { [paramId]: meterValue };

                    localStorage.setItem(slotKey, JSON.stringify({
                        date,
                        slot: selectedSlot,
                        operator: operatorName,
                        data: slotData,
                        updatedAt: new Date().getTime()
                    }));
                } catch(e) {}

                setSyncStatus("Menyimpan...");

                if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
                syncTimeoutRef.current = setTimeout(async () => {
                    try {
                        const combined = getMergedLocalData(date);
                        const payload = {
                            status: "Submitted",
                            meteringData: combined.meteringData,
                            operatorsBySlot: combined.operatorsBySlot,
                            updatedBy: operatorName
                        };

                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "save", date, payload })
                        });
                        setSyncStatus("Tersimpan di Drive");
                    } catch(err) {
                        setSyncStatus("Tersimpan di Lokal");
                    }
                }, 1000);

                alert(`Data slot ${selectedSlot} berhasil disimpan!`);
            };

            return (
                <div className="max-w-4xl mx-auto p-6 space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex justify-between items-center border-b pb-4">
                            <h1 className="text-xl font-bold text-slate-900">Multi-User Daily Metering Report</h1>
                            <span className="text-xs bg-slate-100 px-3 py-1 rounded-full font-semibold text-emerald-600">
                                Status: {syncStatus}
                            </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Tanggal</label>
                                <input 
                                    type="date" 
                                    value={date} 
                                    onChange={e => setDate(e.target.value)}
                                    className="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Nama Operator</label>
                                <input 
                                    type="text" 
                                    value={operatorName} 
                                    placeholder="Contoh: Muammar / Murjani"
                                    onChange={e => setOperatorName(e.target.value)}
                                    className="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Pilih Jam / Slot</label>
                                <select 
                                    value={selectedSlot} 
                                    onChange={e => {
                                        setSelectedSlot(e.target.value);
                                        const existingVal = meteringData["DefaultParam"]?.[e.target.value] || "";
                                        setMeterValue(existingVal);
                                    }}
                                    className="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-blue-600"
                                >
                                    {TIME_SLOTS.map(slot => (
                                        <option key={slot} value={slot}>Slot Jam {slot}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div>
                            <label className="block text-xs font-bold uppercase text-slate-600 mb-1">Nilai Metering (Slot {selectedSlot})</label>
                            <input 
                                type="number" 
                                value={meterValue} 
                                placeholder="Masukkan angka meteran..."
                                onChange={e => setMeterValue(e.target.value)}
                                className="w-full p-3 border rounded-lg text-base bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold" 
                            />
                        </div>

                        <button 
                            onClick={handleSaveInput}
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition"
                        >
                            Simpan Input Jam {selectedSlot}
                        </button>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden p-6 space-y-4">
                        <h3 className="font-bold text-slate-800 text-base">Rekapitulasi Semua Slot Waktu (Multi-User)</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-100 text-slate-700 uppercase border-b">
                                        <th className="p-3 font-bold border-r">Slot Waktu</th>
                                        <th className="p-3 font-bold border-r">Petugas On Duty</th>
                                        <th className="p-3 font-bold">Nilai Meteran</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {TIME_SLOTS.map(slot => {
                                        const op = operatorsBySlot[slot] || "-";
                                        const val = meteringData["DefaultParam"]?.[slot] ?? "-";
                                        return (
                                            <tr key={slot} className={slot === selectedSlot ? "bg-blue-50/50 font-bold" : "hover:bg-slate-50"}>
                                                <td className="p-3 border-r font-mono text-slate-700">{slot}</td>
                                                <td className="p-3 border-r text-slate-600">{op}</td>
                                                <td className="p-3 text-slate-900">{val}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
