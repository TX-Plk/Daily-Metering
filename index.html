<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report Metering - STA. MNCGROUP PALANGKA RAYA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function App() {
            // State Simulasi Aplikasi
            const [user, setUser] = React.useState({ name: "Muammar Ghadafi", role: "admin" });
            const [status, setStatus] = React.useState("Draft");
            const [driveLoading, setDriveLoading] = React.useState(false);

            // Handler untuk Rekap Bulanan PDF
            const handleExportMonthlyPdf = () => {
                const monthYear = prompt("Masukkan bulan dan tahun rekap PDF (MM-YYYY):", "10-2026");
                if (!monthYear) return;
                setDriveLoading(true);
                google.script.run
                    .withSuccessHandler(res => {
                        setDriveLoading(false);
                        if(res && res.success) {
                            alert("Berhasil membuat PDF rekap bulanan!");
                            window.open(res.fileUrl, "_blank");
                        } else {
                            alert("Gagal: " + (res ? res.error : "Unknown"));
                        }
                    })
                    .withFailureHandler(err => {
                        setDriveLoading(false);
                        alert("Error: " + err.message);
                    })
                    .exportMonthlyPdf(monthYear);
            };

            // Handler untuk Rekap Rata-rata Bulanan Excel
            const handleExportMonthlyExcel = () => {
                const monthYear = prompt("Masukkan bulan dan tahun rekap Excel (MM-YYYY):", "10-2026");
                if (!monthYear) return;
                setDriveLoading(true);
                google.script.run
                    .withSuccessHandler(res => {
                        setDriveLoading(false);
                        if(res && res.success) {
                            alert("Berhasil membuat file Excel rekap bulanan!");
                            window.open(res.fileUrl, "_blank");
                        } else {
                            alert("Gagal: " + (res ? res.error : "Unknown"));
                        }
                    })
                    .withFailureHandler(err => {
                        setDriveLoading(false);
                        alert("Error: " + err.message);
                    })
                    .exportMonthlyExcel(monthYear);
            };

            const fetchPdfHistory = () => {
                alert("Membuka Riwayat File...");
            };

            const handleSubmitReport = () => {
                setStatus("Pending");
                alert("Laporan berhasil disubmit!");
            };

            return (
                <div className="p-4 max-w-7xl mx-auto space-y-4">
                    {/* Header Top Bar */}
                    <header className="flex flex-wrap justify-between items-center bg-slate-800 p-4 rounded-xl shadow-md border border-slate-700">
                        <div>
                            <h1 className="text-lg font-bold text-white">Daily Report Metering</h1>
                            <p className="text-xs text-slate-400">STA. MNCGROUP PALANGKA RAYA</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-sm bg-slate-700 px-3 py-1 rounded-lg">
                                <strong>{user.name}</strong> <br/>
                                <span className="text-xs text-amber-400">SUPERVISOR / ADMIN</span>
                            </span>
                        </div>
                    </header>

                    {/* Toolbar / Action Buttons Station */}
                    <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded font-semibold">STATUS: {status} (BISA DIISI)</span>
                            <h2 className="text-xl font-bold mt-1 text-white">STA. MNCGROUP PALANGKA RAYA</h2>
                            <p className="text-xs text-slate-400">Operator Saat Ini: {user.name} | Tanggal: 07/10/2026</p>
                        </div>

                        {/* Tombol-tombol Navigasi Admin */}
                        <div className="flex flex-wrap items-center gap-2">
                            {user.role === "admin" && (
                                <>
                                    <button 
                                        onClick={handleExportMonthlyPdf} 
                                        disabled={driveLoading}
                                        className="bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 disabled:opacity-50 transition-all"
                                    >
                                        📄 {driveLoading ? "Proses..." : "Rekap Bulanan PDF"}
                                    </button>

                                    {/* Tombol Rekap Excel yang Ditambahkan */}
                                    <button 
                                        onClick={handleExportMonthlyExcel} 
                                        disabled={driveLoading}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 disabled:opacity-50 transition-all"
                                    >
                                        📊 {driveLoading ? "Proses..." : "Rekap Rata-rata Bulanan (Excel)"}
                                    </button>

                                    <button 
                                        onClick={fetchPdfHistory} 
                                        className="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 transition-all"
                                    >
                                        📂 Riwayat File
                                    </button>

                                    {(status === "Draft" || status === "Rejected") && (
                                        <button 
                                            onClick={handleSubmitReport}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center gap-1 transition-all"
                                        >
                                            🚀 Submit Laporan
                                        </button>
                                    )}
                                </>
                            )}
                        </div>
                    </div>

                    {/* Informasi Kotak Statistik */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <p className="text-xs text-slate-400">PROGRES INPUT</p>
                            <h3 className="text-2xl font-bold text-white mt-1">0 <span className="text-xs text-slate-400">/ 12 Slot</span></h3>
                        </div>
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <p className="text-xs text-slate-400">WARNING SYSTEM</p>
                            <h3 className="text-2xl font-bold text-emerald-400 mt-1">0 <span className="text-xs text-slate-400">Peringatan</span></h3>
                        </div>
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <p className="text-xs text-slate-400">FASILITAS</p>
                            <h3 className="text-2xl font-bold text-emerald-400 mt-1">OK</h3>
                        </div>
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <p className="text-xs text-slate-400">STATUS APPROVAL</p>
                            <h3 className="text-2xl font-bold text-amber-400 mt-1">{status}</h3>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
</body>
</html>
